name: Test en uitrollen

# Elke push naar main: eerst de offline tests, en alleen als die slagen wordt de VPS
# bijgewerkt (git pull + docker compose up --build via scripts/deploy.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Afhankelijkheden
        run: pip install -r requirements.txt
      - name: Offline tests (brein gestubd)
        run: python -m unittest tests.test_adapters -v

  deploy:
    name: Uitrollen op de VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: SSH-sleutel en hostsleutel klaarzetten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # hostsleutel van de VPS (ed25519), vastgelegd zodat er niets blind vertrouwd wordt
          echo "167.233.70.137 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIODP2Cr6qx8tLBafTyT8PtleHr67O+r4JoRw0DhcscN9" >> ~/.ssh/known_hosts
      - name: Deploy-script op de VPS starten
        # de sleutel mag op de VPS alléén scripts/deploy.sh draaien (forced command)
        run: ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@167.233.70.137 deploy
