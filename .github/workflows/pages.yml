name: Homepage en privacyverklaring

# Publiceert site/ (homepage + privacyverklaring) op GitHub Pages:
#   https://jababakker.github.io/Birdy/
#   https://jababakker.github.io/Birdy/privacy.html
# Deze twee URL's zijn nodig om de Google OAuth-app op "In production" te zetten,
# zodat het refresh-token niet meer elke 7 dagen verloopt.
# Eenmalig: Settings → Pages → Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publiceren
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
